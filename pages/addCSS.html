<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <h1>Calc - HTML + CSS</h1>
    <video src="https://www.pexels.com/download/video/27845108/" controls width="150"></video>
    <div class="calculator">
        <input type="text" id="result" readonly>
            <div class="buttons">
                <button class="clear">C</button>
                <button class="operator">/</button>
                <button class="operator">*</button>
                <button class="operator">-</button>
                <button class="number">7</button>
                <button class="number">8</button>
                <button class="number">9</button>
                <button class="operator">+</button>
                <button class="number">4</button>
                <button class="number">5</button>
                <button class="number">6</button>
                <button class="equals">=</button>
                <button class="number">1</button>
                <button class="number">2</button>
                <button class="number">3</button>
                <button class="number">0</button>
                <button class="decimal">.</button>
                <button class="number">dog</button>
            </div>
            <img src="https://images.pexels.com/photos/20680840/pexels-photo-20680840.jpeg" alt="dog" width="350">
    </div>
    <div>
        Links to other versions:
        <ul>
            <li><a href="../index.html">Fully Featured</a></li>
            <li><a href="../pages/plainHTML.html">Just HTML</a></li>
            <li><a href="../pages/addCSS.html">HTML+CSS</a></li>
            <li><a href="../pages/addJS.html">HTML+JS</a></li>
        </ul>
    </div>
    <!-- Uncomment the next line to add interactivity! -->
    <!-- <script src="../index.js"></script> -->
</body>

</html>
